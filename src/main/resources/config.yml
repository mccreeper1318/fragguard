# Player notifications for upcoming FragGuard database maintenance.
# The countdown is scheduled by the future maintenance controls (#169); these
# settings do NOT automatically start maintenance or run database compaction.
maintenance-countdown-seconds: 600
# Chat warnings in seconds remaining (duplicates and out-of-range values ignored).
maintenance-warning-seconds: [600, 300, 180, 60, 30, 10]
# Configurable Minecraft Boss Bars: supported colors include YELLOW, RED, BLUE, GREEN.
maintenance-countdown-bossbar-enabled: true
maintenance-staff-bossbar-enabled: true
maintenance-countdown-bossbar-color: YELLOW
maintenance-active-bossbar-color: RED
maintenance-compacting-bossbar-color: BLUE
maintenance-ready-bossbar-color: GREEN
maintenance-countdown-bossbar-title: "&eMaintenance Begins in %time%"
maintenance-active-bossbar-title: "&cSERVER MAINTENANCE ACTIVE"
maintenance-compacting-bossbar-title: "&bDATABASE COMPACTION IN PROGRESS"
maintenance-verifying-bossbar-title: "&bVERIFYING COMPACTED DATABASE"
maintenance-ready-bossbar-title: "&aDATABASE READY - RESTART REQUIRED"
maintenance-failed-bossbar-title: "&cMAINTENANCE ERROR - STAFF REVIEW REQUIRED"
# %time% displays actual remaining mm:ss; traditional & color formatting works.
maintenance-warning-message: "&eServer maintenance begins in &f%time%&e. Please finish up."
maintenance-start-message: "&cServer maintenance has started."
maintenance-postponed-message: "&eMaintenance could not start safely and has been cancelled."
# Message when a regular player is kicked at maintenance activation, with & color formatting.
maintenance-kick-message: "&cMaintenance has started. Please return when the server reopens."
# Message when a regular player tries to reconnect during active maintenance.
maintenance-login-denied-message: "&cThe server is undergoing database maintenance. Please return later."

# How long block logs are kept before automatic deletion.
retention-days: 30

# How often old records are removed from SQLite.
cleanup-interval-minutes: 60

# How long completed/undone rollback jobs remain available before their saved snapshots are deleted.
# Recoverable failed jobs are kept so /fg undo can still finish them.
rollback-job-retention-days: 30

# Bound memory usage while SQLite writes are grouped into transactions.
database-write-queue-capacity: 20000
database-operation-queue-capacity: 256
database-write-batch-size: 500
database-query-timeout-seconds: 15
# Separate read-only diagnostics have their own limits and never occupy the write worker.
# Exact counts may scan tens of millions of records. A full quick_check may scan every DB page.
diagnostics-query-timeout-seconds: 15
diagnostics-quick-check-timeout-seconds: 45
# Opt-in full-history/BLOB scan: 1-21600 seconds, default one hour.
# Incomplete/interrupted scans are never trusted as verification.
diagnostics-deep-timeout-seconds: 3600
# Slow startup work (including migration backups/schema maintenance) reports progress instead of failing at 30s.
database-startup-warning-seconds: 30
# 0 disables the hard startup cutoff so large databases can finish initializing safely.
# Set this above 0 only if you explicitly want FragGuard to abort SQLite startup after that many seconds.
database-startup-timeout-seconds: 0
# Every existing-database schema upgrade uses an estimated WAL/index/backup space preflight.
# Java filesystem free space is NOT proof of a hosting account quota or SQLite native temp capacity.
# Keep enabled unless you understand the risk of bypassing this estimate.
database-migration-space-preflight-enabled: true
# Extra free-space margin beyond the estimated migration working set.
database-migration-space-safety-mib: 256
# Optional: confirmed FREE space (MiB, not total allocated capacity) remaining under your
# hosting account/container quota. 0 = unknown. Set only if the host can provide a current value.
# A stale value does not reserve space and cannot guarantee a successful migration.
database-migration-account-free-mib: 0
# Optional: confirmed FREE space (MiB) in SQLite's actual native TEMP area, not merely Java /tmp.
# 0 = unknown. The SQLite VFS can use a different temp filesystem than java.io.tmpdir.
database-migration-sqlite-temp-free-mib: 0
# Auto-pruning only applies to backups this version has explicitly created and marked as verified;
# older/unmarked backups are never deleted automatically. At least one verified full migration backup is retained.
database-migration-backup-retention-count: 1

# Compaction capacity preflight (#164), separate from schema migration above.
# Estimated free headroom includes a new candidate, WAL growth, SQLite working
# space, verification allowance, and margin; the original and backups remain intact.
# -1 = UNKNOWN (default), 0 = confirmed zero free, positive = operator-confirmed
# CURRENT FREE MiB from your host/account or SQLite's actual native temp mount.
# These are NOT total plan quotas or Java FileStore / java.io.tmpdir estimates.
# Stale values can change before/during VACUUM INTO; SQLITE_FULL remains possible.
maintenance-compaction-account-free-mib: -1
maintenance-compaction-sqlite-temp-free-mib: -1
maintenance-compaction-safety-mib: 256
# Unknown values require an explicit per-request admin acknowledgement in-game.
# Acknowledgement can NEVER bypass known insufficient capacity, unsafe paths,
# existing candidates, or a stale preflight. No automatic candidate cleanup.

database-shutdown-timeout-seconds: 15
# Extra grace period after an active SQLite statement is cancelled during shutdown.
database-shutdown-cancel-timeout-seconds: 5

# How quickly FragGuard notices and reports degraded logging to online operators.
database-health-check-interval-seconds: 5
database-operator-warning-interval-seconds: 60

# What FragGuard should log.
log-explosions: true
# Includes initial ignition, fire spreading, and blocks destroyed by fire.
log-fire-spread: true
# Includes natural liquid flow, player buckets, sponge absorption, and dispenser buckets.
log-liquid-flow: true
log-pistons: true

# Lookup output settings.
lookup-page-size: 15
max-lookup-radius: 150

# In-game lookup GUI streaming and grouping settings.
# This bounds how many lightweight history rows a grouped GUI page scans per SQLite fetch.
# It does NOT limit how many total history rows an operator can browse.
# Raw result pages remain small and block-entity BLOBs are still loaded only for one opened exact event.
# Zero or negative values are invalid; FragGuard warns at startup and uses the default of 1000.
gui-lookup-fetch-size: 1000
# Debug only: print SQLite EXPLAIN QUERY PLAN for GUI counts, filter scans, and pages.
# Disabled by default; enable temporarily while investigating unusually slow areas.
gui-log-query-plans: false
# Consecutive events with the same actor/action/material can be condensed when they are locally close.
gui-activity-max-gap-millis: 2500
gui-activity-max-distance: 6
# A condensed heuristic activity is also bounded as a whole so locally adjacent chains cannot grow indefinitely.
gui-activity-max-duration-millis: 15000
gui-activity-max-span: 24

# Rollback safety settings.
# Increase these if you trust your server hardware and know the radius can be large.
max-rollback-radius: 100
# Retain a hard block cap as a secondary safeguard alongside the time budget.
rollback-blocks-per-tick: 500
# Maximum combined rollback/undo work on the main thread during one server tick.
rollback-max-millis-per-tick: 4.0
# Pause rollback/undo work while the server's recent TPS falls below this value; 0 disables pausing.
rollback-minimum-tps: 18.0
rollback-max-blocks-per-command: 50000
# Maximum combined block-entity snapshot bytes loaded by one rollback preview or rollback/undo job (64 MiB).
rollback-max-snapshot-bytes-per-command: 67108864
# Reject previews, execution, and recovery jobs that span more than this many existing chunks.
rollback-max-chunks-per-command: 256
# Preview tokens expire before a rollback can be confirmed.
rollback-confirmation-timeout-seconds: 60

# The outline is client-only particles, visible only to the operator.
rollback-preview-visualization-enabled: true
# 0 = sparse, 1 = standard (24/32/48/64 points), 2 = detailed; capped to 96 points.
rollback-preview-perimeter-quality: 1
# Spacing of the sparse full-height guide columns. Clamped to 16-192 blocks,
# and a maximum of 12 interior levels per guide column.
rollback-preview-vertical-spacing: 64
# Draw a brighter circular ring at the operator's current elevation.
rollback-preview-operator-ring-enabled: true
# Particle refresh cadence in ticks. Clamped to 10-100; default: once per second.
rollback-preview-update-ticks: 20
# Optional color overrides; use #RRGGBB (invalid values fall back to defaults).
rollback-preview-border-color: "#00FFFF"
rollback-preview-height-color: "#FFFF00"
rollback-preview-center-color: "#00FF00"

# Usually false is safer for rollback because it avoids triggering gravity/neighbor updates everywhere.
apply-physics-during-rollback: false
