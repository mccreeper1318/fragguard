name: FragGuard
version: ${version}
main: org.pinnaclesmp.fragguard.FragGuardPlugin
description: Logs block placement and destruction for radius lookups and rollbacks.
author: Kevin
api-version: '26.3'
commands:
  fg:
    description: FragGuard block logging, lookup, and rollback commands.
    usage: /fg <lookup|rollback|undo|status|diagnostics|help>
    aliases: [fragguard]
permissions:
  fragguard.admin:
    description: Allows use of all FragGuard commands.
    default: op
  fragguard.maintenance.bypass:
    description: Allows authorized staff to see maintenance status and later bypass maintenance admission restrictions.
    default: op
