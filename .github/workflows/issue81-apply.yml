          python3 <<'PY'
          from pathlib import Path
          path = Path('changelog.md')
          text = path.read_text()
          marker = '### Fixed\n\n'
          entry = ('- Fixed #81 by logging Paper 26.3 Shelf inventory swaps even when block data is unchanged, '
                   'including connected powered shelves, and added Shelf-specific lookup/raw-detail, conflict-protection, '
