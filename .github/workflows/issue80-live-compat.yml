name: Issue 80 live Paper compatibility

on:
  push:
    branches:
      - 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Build live compatibility verifier
        shell: bash
        run: |
          cp src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java /tmp/FragGuardPlugin.java
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java')
          text = path.read_text()
          needle = '    public void onEnable() {\n'
          injected = '''    public void onEnable() {\n        if (Boolean.getBoolean("fragguard.issue80.verify262")) {\n            try {\n                byte[] oldItems = java.util.Base64.getDecoder().decode(\n                        "AQAAAAMAAABMH4sIAAAAAAAA/+NiYGBm4HZJLEkMSy0qzszPY2AQVudgYMpMYRDMzcxLTS5KTCuxSslMzM3PS2FmYE3OL80rYQBpAgAFZtm1OgAAAAAAAAAAAABPH4sIAAAAAAAA/+NiYGBm4HZJLEkMSy0qzszPY2AQVudgYMpMYRDKzcxLTS5KTCuxyk/Mji/OTM9jZmBNzi/NK2FgYGBiAABEjV0KOwAAAA==");\n                org.bukkit.inventory.ItemStack[] currentContents = new org.bukkit.inventory.ItemStack[]{\n                        new org.bukkit.inventory.ItemStack(org.bukkit.Material.DIAMOND, 3),\n                        null,\n                        new org.bukkit.inventory.ItemStack(org.bukkit.Material.OAK_SIGN, 2)\n                };\n                byte[] currentItems = org.bukkit.inventory.ItemStack.serializeItemsAsBytes(currentContents);\n                java.util.function.Function<byte[], byte[]> envelope = itemBytes -> {\n                    try {\n                        java.io.ByteArrayOutputStream bytes = new java.io.ByteArrayOutputStream();\n                        try (java.io.DataOutputStream output = new java.io.DataOutputStream(new java.util.zip.GZIPOutputStream(bytes))) {\n                            output.writeInt(0x46474245);\n                            output.writeByte(1);\n                            output.writeUTF("INVENTORY");\n                            output.writeBoolean(false);\n                            output.writeInt(itemBytes.length);\n                            output.write(itemBytes);\n                        }\n                        return bytes.toByteArray();\n                    } catch (java.io.IOException exception) {\n                        throw new IllegalStateException(exception);\n                    }\n                };\n                byte[] oldSnapshot = envelope.apply(oldItems);\n                byte[] currentSnapshot = envelope.apply(currentItems);\n                org.bukkit.inventory.ItemStack[] decoded =\n                        org.bukkit.inventory.ItemStack.deserializeItemsFromBytes(oldItems);\n                if (decoded.length != 3\n                        || decoded[0].getType() != org.bukkit.Material.DIAMOND\n                        || decoded[0].getAmount() != 3\n                        || !decoded[1].getType().isAir()\n                        || decoded[2].getType() != org.bukkit.Material.OAK_SIGN\n                        || decoded[2].getAmount() != 2) {\n                    throw new IllegalStateException("26.2 item payload did not decode safely on Paper 26.3");\n                }\n                if (!BlockEntitySnapshot.equivalent(oldSnapshot, currentSnapshot)) {\n                    throw new IllegalStateException("26.2 and 26.3 snapshots were not semantically equivalent");\n                }\n                if (!FragGuardCommand.matchesState("minecraft:chest", currentSnapshot,\n                        "minecraft:chest", oldSnapshot)) {\n                    throw new IllegalStateException("rollback conflict protection rejected unchanged 26.2 history");\n                }\n                getLogger().info("ISSUE80_262_SNAPSHOT_COMPATIBILITY=PASS");\n                org.bukkit.Bukkit.shutdown();\n                return;\n            } catch (RuntimeException exception) {\n                throw exception;\n            }\n        }\n'''
          if needle not in text:
              raise SystemExit('Could not locate onEnable')
          path.write_text(text.replace(needle, injected, 1))
          PY
          ./gradlew --no-daemon shadowJar
          mv /tmp/FragGuardPlugin.java src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java

      - name: Download Paper 26.3 build 136 beta
        shell: bash
        run: |
          USER_AGENT='FragGuard-compatibility-test/26.3-1.2.0 (github.com/mccreeper1318/fragguard)'
          BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" https://fill.papermc.io/v3/projects/paper/versions/26.3/builds)
          URL=$(printf '%s' "$BUILDS" | jq -r 'first(.[] | select(.id == 136) | .downloads."server:default".url) // empty')
          test -n "$URL"
          curl -fsSL -H "User-Agent: $USER_AGENT" -o paper.jar "$URL"

      - name: Verify historical snapshot on Paper 26.3
        shell: bash
        run: |
          mkdir -p server/plugins
          cp paper.jar server/paper.jar
          cp build/libs/*.jar server/plugins/
          printf 'eula=true\n' > server/eula.txt
          cd server
          set +e
          timeout 180 java -Dfragguard.issue80.verify262=true -Xms512M -Xmx1G -jar paper.jar --nogui 2>&1 | tee server.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi
          grep 'ISSUE80_262_SNAPSHOT_COMPATIBILITY=PASS' server.log
