name: Fix issue 45

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/issue-45-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply issue 45 fix
        run: python .github/issue-45-fix.py
      - name: Run tests
        run: ./gradlew test --no-daemon
      - name: Commit fix
        run: |
          rm .github/workflows/issue-45-fix.yml .github/issue-45-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix TNT priming block history (#45)'
          git push origin HEAD:dev
