name: Build FragGuard

run-name: Build FragGuard from ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Read project version
        id: version
        shell: bash
        run: |
          PROJECT_VERSION="$(
            sed -nE \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              build.gradle.kts \
              | head -n 1
          )"

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not read the project version from build.gradle.kts."
            exit 1
          fi

          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Project version: $PROJECT_VERSION"

      - name: Verify dependency lock state
        shell: bash
        run: |
          ./gradlew --no-daemon dependencies --write-locks
          if [[ -n "$(git status --porcelain -- gradle.lockfile)" ]]; then
            echo "gradle.lockfile is missing or stale. Regenerate it with ./gradlew dependencies --write-locks and commit the result."
            git status --short -- gradle.lockfile
            exit 1
          fi

      - name: Build and test plugin
        run: ./gradlew --no-daemon clean build

      - name: Verify and stage plugin
        id: plugin
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED_NAME="FragGuard-${VERSION}.jar"
          EXPECTED_JAR="build/libs/${EXPECTED_NAME}"

          if [[ ! -f "$EXPECTED_JAR" ]]; then
            echo "Expected plugin JAR was not created: $EXPECTED_JAR"
            echo "Available files:"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          for REQUIRED_FILE in plugin.yml config.yml; do
            if ! jar tf "$EXPECTED_JAR" | grep -qx "$REQUIRED_FILE"; then
              echo "The built JAR does not contain $REQUIRED_FILE."
              exit 1
            fi
          done

          PLUGIN_VERSION="$(python3 - "$EXPECTED_JAR" <<'PY'
          import re
          import sys
          import zipfile

          jar_path = sys.argv[1]
          with zipfile.ZipFile(jar_path) as archive:
              plugin_yml = archive.read("plugin.yml").decode("utf-8")

          match = re.search(
              r"(?m)^\s*version:\s*['\"]?([^'\"\s]+)['\"]?\s*$",
              plugin_yml,
          )
          if match is None:
              raise SystemExit("Could not read the version from plugin.yml inside the JAR.")

          print(match.group(1))
          PY
          )"

          if [[ "$PLUGIN_VERSION" != "$VERSION" ]]; then
            echo "plugin.yml version does not match the Gradle project version."
            echo "Project version:    $VERSION"
            echo "plugin.yml version: $PLUGIN_VERSION"
            exit 1
          fi

          BUILD_DIR="build/check"
          mkdir -p "$BUILD_DIR"
          cp "$EXPECTED_JAR" "$BUILD_DIR/$EXPECTED_NAME"

          (
            cd "$BUILD_DIR"
            sha256sum "$EXPECTED_NAME" > "$EXPECTED_NAME.sha256"
          )

          echo "jar=$BUILD_DIR/$EXPECTED_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$BUILD_DIR/$EXPECTED_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "Built and verified: $BUILD_DIR/$EXPECTED_NAME"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fragguard-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            ${{ steps.plugin.outputs.jar }}
            ${{ steps.plugin.outputs.checksum }}
          if-no-files-found: error

      - name: Upload generated dependency lock for diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-gradle-lock-${{ github.sha }}
          path: gradle.lockfile
          if-no-files-found: ignore
