name: Issue 79 Paper 26.3 API compatibility fix

on:
  push:
    branches:
      - 79-resolve-paper-26-3-beta-compile-and-api-compatibility

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 79-resolve-paper-26-3-beta-compile-and-api-compatibility
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply compatibility changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing expected text for {label}')
              return text.replace(old, new, 1)

          # GUI renderer: move inventory titles and item metadata to Adventure components.
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardGuiRenderer.java')
          text = path.read_text()
          text = replace_once(text,
              'import org.bukkit.ChatColor;\n',
              'import net.kyori.adventure.text.Component;\nimport net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer;\n',
              'FragGuardGuiRenderer imports')
          text = replace_once(text,
              '    private static final int MAX_LORE_DETAIL_LENGTH = 72;\n',
              '    private static final int MAX_LORE_DETAIL_LENGTH = 72;\n    private static final LegacyComponentSerializer LEGACY_TEXT = LegacyComponentSerializer.legacyAmpersand();\n',
              'FragGuardGuiRenderer serializer')
          text, count = re.subn(r'Bukkit\.createInventory\(null, (\d+),\s*color\(',
                                r'Bukkit.createInventory(null, \1, component(', text)
          if count != 11:
              raise SystemExit(f'Expected 11 FragGuardGuiRenderer inventory title replacements, got {count}')
          text = replace_once(text,
              '        meta.setDisplayName(color(name));\n        if (!lore.isEmpty()) {\n            meta.setLore(lore.stream().map(FragGuardGuiRenderer::color).toList());\n        }',
              '        meta.displayName(component(name));\n        if (!lore.isEmpty()) {\n            meta.lore(lore.stream().map(FragGuardGuiRenderer::component).toList());\n        }',
              'FragGuardGuiRenderer item metadata')
          text = replace_once(text,
              "    private static String color(String value) {\n        return ChatColor.translateAlternateColorCodes('&', value);\n    }",
              '    private static Component component(String value) {\n        return LEGACY_TEXT.deserialize(value);\n    }',
              'FragGuardGuiRenderer color helper')
          path.write_text(text)

          # Database-backed GUI renderer: same Adventure migration, preserving legacy ampersand formatting.
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardPagedLookupRenderer.java')
          text = path.read_text()
          text = replace_once(text,
              'import org.bukkit.ChatColor;\n',
              'import net.kyori.adventure.text.Component;\nimport net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer;\n',
              'FragGuardPagedLookupRenderer imports')
          text = replace_once(text,
              '    private static final DateTimeFormatter TIME = DateTimeFormatter.ofPattern("MMM d, yyyy h:mm:ss a")\n',
              '    private static final LegacyComponentSerializer LEGACY_TEXT = LegacyComponentSerializer.legacyAmpersand();\n    private static final DateTimeFormatter TIME = DateTimeFormatter.ofPattern("MMM d, yyyy h:mm:ss a")\n',
              'FragGuardPagedLookupRenderer serializer')
          text, count = re.subn(r'Bukkit\.createInventory\(null, (\d+),\s*color\(',
                                r'Bukkit.createInventory(null, \1, component(', text)
          if count != 3:
              raise SystemExit(f'Expected 3 FragGuardPagedLookupRenderer inventory title replacements, got {count}')
          text = replace_once(text,
              '        meta.setDisplayName(color(name));\n        if (!lore.isEmpty()) {\n            meta.setLore(lore.stream().map(FragGuardPagedLookupRenderer::color).toList());\n        }',
              '        meta.displayName(component(name));\n        if (!lore.isEmpty()) {\n            meta.lore(lore.stream().map(FragGuardPagedLookupRenderer::component).toList());\n        }',
              'FragGuardPagedLookupRenderer item metadata')
          text = replace_once(text,
              "    private static String color(String value) {\n        return ChatColor.translateAlternateColorCodes('&', value);\n    }",
              '    private static Component component(String value) {\n        return LEGACY_TEXT.deserialize(value);\n    }',
              'FragGuardPagedLookupRenderer color helper')
          path.write_text(text)

          # Command output still uses String sendMessage paths; preserve section-code behavior with Adventure serializers.
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardCommand.java')
          text = path.read_text()
          text = replace_once(text,
              'import org.bukkit.ChatColor;\n',
              'import net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer;\nimport net.kyori.adventure.text.serializer.plain.PlainTextComponentSerializer;\n',
              'FragGuardCommand imports')
          text = replace_once(text,
              '    private static final DateTimeFormatter DATE_FORMAT = DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss z")\n            .withZone(ZoneId.systemDefault());\n',
              '    private static final DateTimeFormatter DATE_FORMAT = DateTimeFormatter.ofPattern("yyyy-MM-dd HH:mm:ss z")\n            .withZone(ZoneId.systemDefault());\n    private static final LegacyComponentSerializer LEGACY_INPUT = LegacyComponentSerializer.legacyAmpersand();\n    private static final LegacyComponentSerializer LEGACY_OUTPUT = LegacyComponentSerializer.legacySection();\n    private static final PlainTextComponentSerializer PLAIN_TEXT = PlainTextComponentSerializer.plainText();\n',
              'FragGuardCommand serializers')
          text = replace_once(text,
              '            plugin.getLogger().info(ChatColor.stripColor(color(text)));',
              '            plugin.getLogger().info(PLAIN_TEXT.serialize(LEGACY_INPUT.deserialize(text)));',
              'FragGuardCommand logger text')
          text = replace_once(text,
              "    private String color(String message) {\n        return ChatColor.translateAlternateColorCodes('&', message);\n    }",
              '    private String color(String message) {\n        return LEGACY_OUTPUT.serialize(LEGACY_INPUT.deserialize(message));\n    }',
              'FragGuardCommand color helper')
          path.write_text(text)

          # GUI controller keeps String command messages but no longer relies on deprecated Bukkit ChatColor.
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardGui.java')
          text = path.read_text()
          text = replace_once(text,
              'import org.bukkit.ChatColor;\n',
              'import net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer;\n',
              'FragGuardGui imports')
          text = replace_once(text,
              'final class FragGuardGui implements Listener {\n',
              'final class FragGuardGui implements Listener {\n    private static final LegacyComponentSerializer LEGACY_INPUT = LegacyComponentSerializer.legacyAmpersand();\n    private static final LegacyComponentSerializer LEGACY_OUTPUT = LegacyComponentSerializer.legacySection();\n',
              'FragGuardGui serializers')
          text = replace_once(text,
              "    private String color(String text) {\n        return ChatColor.translateAlternateColorCodes('&', text);\n    }",
              '    private String color(String text) {\n        return LEGACY_OUTPUT.serialize(LEGACY_INPUT.deserialize(text));\n    }',
              'FragGuardGui color helper')
          path.write_text(text)

          # Storage health warnings can use Paper's Adventure message API directly.
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java')
          text = path.read_text()
          text = replace_once(text,
              'import org.bukkit.ChatColor;\n',
              'import net.kyori.adventure.text.Component;\nimport net.kyori.adventure.text.format.NamedTextColor;\n',
              'FragGuardPlugin imports')
          text = replace_once(text,
              '            if (player.isOp() || player.hasPermission("fragguard.admin")) player.sendMessage(ChatColor.RED + "[FragGuard] " + message);',
              '            if (player.isOp() || player.hasPermission("fragguard.admin"))\n                player.sendMessage(Component.text("[FragGuard] " + message, NamedTextColor.RED));',
              'FragGuardPlugin warning message')
          path.write_text(text)

          # Record the 26.3 compatibility review without implying a behavior change.
          path = Path('changelog.md')
          text = path.read_text()
          marker = '### Changed\n\n'
          line = '- Reviewed Paper 26.3 beta source compatibility and migrated GUI/message presentation from deprecated legacy Bukkit string/color APIs to Adventure components and serializers; event logging, block-entity snapshots, and rollback/undo APIs required no compatibility shims.\n'
          if line not in text:
              if marker not in text:
                  raise SystemExit('Changelog Changed section not found')
              text = text.replace(marker, marker + line, 1)
              path.write_text(text)
          PY

      - name: Verify Paper 26.3 compilation and deprecations
        shell: bash
        run: |
          cat > /tmp/issue79-deprecation.init.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  options.compilerArgs.addAll(['-Xlint:deprecation'])
              }
          }
          EOF
          ./gradlew --no-daemon clean compileJava compileTestJava --warning-mode all --init-script /tmp/issue79-deprecation.init.gradle

      - name: Run full compatibility build
        run: ./gradlew --no-daemon clean test build

      - name: Commit compatibility fix
        shell: bash
        run: |
          rm .github/workflows/issue79-api-audit.yml
          git add src/main/java/org/pinnaclesmp/fragguard/FragGuardGuiRenderer.java \
                  src/main/java/org/pinnaclesmp/fragguard/FragGuardPagedLookupRenderer.java \
                  src/main/java/org/pinnaclesmp/fragguard/FragGuardCommand.java \
                  src/main/java/org/pinnaclesmp/fragguard/FragGuardGui.java \
                  src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java \
                  changelog.md .github/workflows/issue79-api-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve Paper 26.3 API compatibility (#79)'
          git push origin HEAD:79-resolve-paper-26-3-beta-compile-and-api-compatibility
