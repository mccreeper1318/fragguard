name: Apply issue 68 migration storage fix

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/issue-68-fix.yml"
      - ".github/scripts/issue68.py"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Apply issue 68 changes
        run: python3 .github/scripts/issue68.py

      - name: Remove helper files from resulting commit
        run: git rm .github/workflows/issue-68-fix.yml .github/scripts/issue68.py

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -n "schema v3->v4 is index-only" src/main/java/org/pinnaclesmp/fragguard/Database.java
          grep -n "database-migration-space-preflight-enabled" src/main/resources/config.yml README.md

      - name: Build and test patched tree
        run: ./gradlew --no-daemon clean test

      - name: Commit issue 68 fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix storage-heavy database migrations (#68)"
          git push origin HEAD:dev
