name: Apply issue 68 migration storage fix

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/issue-68-fix.yml"

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Apply issue 68 changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          db_path = Path("src/main/java/org/pinnaclesmp/fragguard/Database.java")
          db = db_path.read_text()

          db = replace_once(
              db,
              "import java.io.File;\n",
              "import java.io.File;\nimport java.io.IOException;\n",
              "Database IOException import",
          )
          db = replace_once(
              db,
              "import java.util.Arrays;\n",
              "import java.util.Arrays;\nimport java.util.Comparator;\n",
              "Database Comparator import",
          )

