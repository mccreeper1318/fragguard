name: PR 89 Codex framing fix retry

on:
  push:
    branches:
      - 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3
    paths:
      - .github/workflows/pr89-codex-fix2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply patch from helper and correct fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          text = Path('.github/workflows/pr89-codex-fix.yml').read_text()
          marker = "echo '"
          start = text.index(marker) + len(marker)
          end = text.index("' | base64 -d", start)
          Path('/tmp/pr89_fix.py').write_bytes(base64.b64decode(text[start:end]))
          PY
          python3 /tmp/pr89_fix.py
          sed -i 's/output\.writeUTF(""INVENTORY");/output.writeUTF("INVENTORY");/' src/test/java/org/pinnaclesmp/fragguard/BlockEntitySnapshotTest.java
      - name: Run focused and full tests
        run: |
          ./gradlew --no-daemon test --tests org.pinnaclesmp.fragguard.BlockEntitySnapshotTest --tests org.pinnaclesmp.fragguard.BlockEntitySnapshotDescriptionTest --tests org.pinnaclesmp.fragguard.Paper262PersistenceCompatibilityTest
          ./gradlew --no-daemon clean build
      - name: Commit validated fix and remove helpers
        shell: bash
        run: |
          rm .github/workflows/pr89-codex-fix.yml .github/workflows/pr89-codex-fix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/pinnaclesmp/fragguard/BlockEntitySnapshot.java \
                  src/test/java/org/pinnaclesmp/fragguard/BlockEntitySnapshotTest.java \
                  src/test/java/org/pinnaclesmp/fragguard/BlockEntitySnapshotDescriptionTest.java \
                  .github/workflows/pr89-codex-fix.yml \
                  .github/workflows/pr89-codex-fix2.yml
          git commit -m "Validate serialized inventory framing before decode"
          git push origin HEAD:80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3
