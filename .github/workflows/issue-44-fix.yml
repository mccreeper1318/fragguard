name: Fix issue 44

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/issue-44-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply issue 44 fix
        shell: python
        run: |
          from pathlib import Path

          db_path = Path('src/main/java/org/pinnaclesmp/fragguard/Database.java')
          text = db_path.read_text()

          text = text.replace(
              'import java.sql.SQLException;\nimport java.sql.Statement;',
              'import java.sql.SQLException;\nimport java.sql.SQLTimeoutException;\nimport java.sql.Statement;'
          )

          old = '''            future.whenComplete((result, throwable) -> {\n                if ((future.isCancelled() || throwable instanceof TimeoutException) && activeQuery == future) {\n                    cancelActiveStatement();\n                }\n            });'''
          new = '''            future.whenComplete((result, throwable) -> {\n                if ((future.isCancelled() || throwable instanceof TimeoutException) && activeQuery == future) {\n                    operation.cancellationRequested = true;\n                    cancelActiveStatement();\n                }\n            });'''
          if old not in text:
              raise SystemExit('submit timeout callback pattern not found')
          text = text.replace(old, new, 1)

          old = '''        } catch (Throwable exception) {\n            if (exception instanceof SQLException) {\n                healthy = false;\n                lastError = exception.getMessage();\n                warnStorage("FragGuard database operation failed; check SQLite storage health.", exception);\n            }\n            operation.future.completeExceptionally(exception);'''
          new = '''        } catch (Throwable exception) {\n            if (exception instanceof SQLException sqlException\n                    && !isExpectedTimedQueryCancellation(operation.timedQuery,\n                    operation.cancellationRequested, sqlException)) {\n                healthy = false;\n                lastError = exception.getMessage();\n                warnStorage("FragGuard database operation failed; check SQLite storage health.", exception);\n            }\n            operation.future.completeExceptionally(exception);'''
          if old not in text:
              raise SystemExit('executeOperation catch pattern not found')
          text = text.replace(old, new, 1)

          marker = '''    private static boolean canCoalesce(BlockChange previous, BlockChange latest) {'''
          helper = '''    static boolean isExpectedTimedQueryCancellation(boolean timedQuery, boolean cancellationRequested,\n                                                    SQLException exception) {\n        if (!timedQuery) {\n            return false;\n        }\n        if (cancellationRequested || exception instanceof SQLTimeoutException) {\n            return true;\n        }\n\n        for (SQLException current = exception; current != null; current = current.getNextException()) {\n            if (current instanceof SQLTimeoutException || current.getErrorCode() == 9) {\n                return true;\n            }\n        }\n        for (Throwable cause = exception.getCause(); cause != null; cause = cause.getCause()) {\n            if (cause instanceof SQLTimeoutException) {\n                return true;\n            }\n            if (cause instanceof SQLException sqlCause && sqlCause.getErrorCode() == 9) {\n                return true;\n            }\n        }\n        return false;\n    }\n\n'''
          if marker not in text:
              raise SystemExit('canCoalesce marker not found')
          text = text.replace(marker, helper + marker, 1)

          old = '''        private final CompletableFuture<T> future;\n        private final boolean timedQuery;'''
          new = '''        private final CompletableFuture<T> future;\n        private final boolean timedQuery;\n        private volatile boolean cancellationRequested;'''
          if old not in text:
              raise SystemExit('DatabaseOperation fields pattern not found')
          text = text.replace(old, new, 1)

          db_path.write_text(text)

          test_path = Path('src/test/java/org/pinnaclesmp/fragguard/DatabaseTest.java')
          tests = test_path.read_text()
          tests = tests.replace(
              'import java.sql.SQLException;\nimport java.sql.Statement;',
              'import java.sql.SQLException;\nimport java.sql.SQLTimeoutException;\nimport java.sql.Statement;'
          )

          marker = '''    @Test\n    void boundsSavedRollbackJobsIncludingSnapshotsCapturedAfterTheirPreview() throws Exception {'''
          test = '''    @Test\n    void treatsTimedQueryTimeoutAndSqliteInterruptAsExpectedCancellation() {\n        assertTrue(Database.isExpectedTimedQueryCancellation(true, true,\n                new SQLException("cancelled by timeout")),\n                "the future timeout path must not be classified as a storage failure");\n        assertTrue(Database.isExpectedTimedQueryCancellation(true, false,\n                new SQLTimeoutException("query timed out")),\n                "a JDBC timeout from the driver is an expected timed-query outcome");\n        assertTrue(Database.isExpectedTimedQueryCancellation(true, false,\n                new SQLException("interrupted", null, 9)),\n                "SQLite SQLITE_INTERRUPT is the normal result of cancelling a timed query");\n        assertFalse(Database.isExpectedTimedQueryCancellation(true, false,\n                new SQLException("disk I/O error", null, 10)),\n                "genuine SQLite storage failures must still degrade health");\n        assertFalse(Database.isExpectedTimedQueryCancellation(false, true,\n                new SQLException("interrupted", null, 9)),\n                "non-timed database operations must not suppress SQLite failures");\n    }\n\n'''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, test + marker, 1)
          test_path.write_text(tests)

          changelog = Path('changelog.md')
          log = changelog.read_text()
          needle = '''- Fixed #43 by preserving distinct same-tick history when different actors or actions modify the same coordinate. Coalescing now applies only to consecutive, state-contiguous transitions with matching attribution and action across both queued and already-flushed writes, while compatible net-no-op chains are still removed.\n'''
          addition = needle + '''- Fixed #44 so expected timed-query cancellations no longer mark SQLite storage unhealthy or emit storage-failure warnings. FragGuard now distinguishes its own timeout cancellation, JDBC query timeouts, and SQLite `SQLITE_INTERRUPT` results from genuine database failures.\n'''
          if needle not in log:
              raise SystemExit('changelog insertion point not found')
          log = log.replace(needle, addition, 1)
          changelog.write_text(log)

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/issue-44-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/org/pinnaclesmp/fragguard/Database.java src/test/java/org/pinnaclesmp/fragguard/DatabaseTest.java changelog.md .github/workflows/issue-44-fix.yml
          git commit -m 'Fix timed query cancellation health handling (#44)'
          git push origin HEAD:dev
