name: Fix PR 77 dependency lock

on:
  push:
    branches:
      - dependabot/gradle/dev/routine-gradle-updates-f1346d1bad

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dependabot/gradle/dev/routine-gradle-updates-f1346d1bad
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Update docs and dependency lock
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          old = 'Requires Java 25. The Gradle 9.7.1 wrapper is committed to the repository and its downloaded distribution is verified by SHA-256.'
          new = 'Requires Java 25. The Gradle 9.8.0 wrapper is committed to the repository and its downloaded distribution is verified by SHA-256.'
          if old not in text:
              raise SystemExit('README wrapper text not found')
          readme.write_text(text.replace(old, new, 1))

          changelog = Path('changelog.md')
          text = changelog.read_text()
          marker = "### Changed\n\n"
          line = "- Updated the Gradle wrapper from `9.7.1` to `9.8.0`, SLF4J NOP from `2.0.19` to `2.0.20`, and Mockito from `5.23.0` to `5.24.0`, with regenerated dependency locks.\n"
          if line not in text:
              if marker not in text:
                  raise SystemExit('Changelog Changed section not found')
              text = text.replace(marker, marker + line, 1)
              changelog.write_text(text)
          PY

          ./gradlew --no-daemon dependencies --write-locks
          ./gradlew --no-daemon dependencies --write-locks

      - name: Remove temporary workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/pr77-fix.yml
          git add README.md changelog.md gradle.lockfile .github/workflows/pr77-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix dependency lock and docs for PR #77'
          git push origin HEAD:dependabot/gradle/dev/routine-gradle-updates-f1346d1bad
