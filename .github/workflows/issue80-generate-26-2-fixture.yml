name: Issue 80 apply persistence compatibility fix

on:
  push:
    branches:
      - 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply compatibility patch
        shell: bash
        run: |
          sed -i '/if text.count(old) != 1:/,+1d' tools/issue80_patch.py
          python3 tools/issue80_patch.py

      - name: Run regression suite
        run: ./gradlew --no-daemon clean test build

      - name: Commit verified fix
        shell: bash
        run: |
          rm tools/issue80_patch.py
          rm .github/workflows/issue80-generate-26-2-fixture.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Preserve Paper 26.2 rollback snapshot compatibility (#80)'
          git push origin HEAD:80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3
