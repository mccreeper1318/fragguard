name: Issue 80 verify 26.2 payload on 26.3

on:
  push:
    branches:
      - 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out current 26.3 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Build temporary 26.3 compatibility verifier
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java')
          text = path.read_text()
          needle = '    public void onEnable() {\n'
          injected = '''    public void onEnable() {\n        if (Boolean.getBoolean("fragguard.issue80.verify262")) {\n            byte[] issue80Bytes = java.util.Base64.getDecoder().decode(\n                    "AQAAAAMAAABMH4sIAAAAAAAA/+NiYGBm4HZJLEkMSy0qzszPY2AQVudgYMpMYRDMzcxLTS5KTCuxSslMzM3PS2FmYE3OL80rYQBpAgAFZtm1OgAAAAAAAAAAAABPH4sIAAAAAAAA/+NiYGBm4HZJLEkMSy0qzszPY2AQVudgYMpMYRDKzcxLTS5KTCuxyk/Mji/OTM9jZmBNzi/NK2FgYGBiAABEjV0KOwAAAA==");\n            org.bukkit.inventory.ItemStack[] issue80Items =\n                    org.bukkit.inventory.ItemStack.deserializeItemsFromBytes(issue80Bytes);\n            if (issue80Items.length != 3\n                    || issue80Items[0] == null\n                    || issue80Items[0].getType() != org.bukkit.Material.DIAMOND\n                    || issue80Items[0].getAmount() != 3\n                    || issue80Items[1] != null\n                    || issue80Items[2] == null\n                    || issue80Items[2].getType() != org.bukkit.Material.OAK_SIGN\n                    || issue80Items[2].getAmount() != 2) {\n                throw new IllegalStateException("Paper 26.3 did not decode the Paper 26.2 ItemStack fixture exactly");\n            }\n            getLogger().info("ISSUE80_262_ITEMSTACK_COMPATIBILITY=PASS");\n            org.bukkit.Bukkit.shutdown();\n            return;\n        }\n'''
          if needle not in text:
              raise SystemExit('Could not locate onEnable')
          path.write_text(text.replace(needle, injected, 1))
          PY
          ./gradlew --no-daemon shadowJar

      - name: Download Paper 26.3 build 136 beta
        shell: bash
        run: |
          USER_AGENT='FragGuard-compatibility-test/26.3-1.2.0 (github.com/mccreeper1318/fragguard)'
          BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" \
            https://fill.papermc.io/v3/projects/paper/versions/26.3/builds)
          URL=$(printf '%s' "$BUILDS" | jq -r 'first(.[] | select(.id == 136) | .downloads."server:default".url) // empty')
          test -n "$URL"
          curl -fsSL -H "User-Agent: $USER_AGENT" -o paper.jar "$URL"

      - name: Decode the 26.2 payload on Paper 26.3
        shell: bash
        run: |
          mkdir -p server/plugins
          cp paper.jar server/paper.jar
          cp build/libs/*.jar server/plugins/
          printf 'eula=true\n' > server/eula.txt
          cd server
          set +e
          timeout 180 java -Dfragguard.issue80.verify262=true -Xms512M -Xmx1G -jar paper.jar --nogui 2>&1 | tee server.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi
          grep 'ISSUE80_262_ITEMSTACK_COMPATIBILITY=PASS' server.log
