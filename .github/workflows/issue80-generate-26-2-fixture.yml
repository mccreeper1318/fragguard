name: Issue 80 generate 26.2 fixture

on:
  push:
    branches:
      - 80-verify-26-2-history-and-rollback-snapshots-remain-compatible-on-paper-26-3

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out 26.2 release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 26.2-1.1.2

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Build temporary 26.2 fixture plugin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/org/pinnaclesmp/fragguard/FragGuardPlugin.java')
          text = path.read_text()
          needle = '    public void onEnable() {\n'
          injected = '''    public void onEnable() {\n        org.bukkit.inventory.ItemStack[] issue80Items = new org.bukkit.inventory.ItemStack[]{\n                new org.bukkit.inventory.ItemStack(org.bukkit.Material.DIAMOND, 3),\n                null,\n                new org.bukkit.inventory.ItemStack(org.bukkit.Material.OAK_SIGN, 2)\n        };\n        byte[] issue80Bytes = org.bukkit.inventory.ItemStack.serializeItemsAsBytes(issue80Items);\n        getLogger().info("ISSUE80_262_ITEMSTACK_BASE64="\n                + java.util.Base64.getEncoder().encodeToString(issue80Bytes));\n        org.bukkit.Bukkit.shutdown();\n        return;\n'''
          if needle not in text:
              raise SystemExit('Could not locate onEnable')
          path.write_text(text.replace(needle, injected, 1))
          PY
          ./gradlew --no-daemon shadowJar

      - name: Download Paper 26.2 build 121
        shell: bash
        run: |
          USER_AGENT='FragGuard-compatibility-test/26.3-1.2.0 (github.com/mccreeper1318/fragguard)'
          BUILDS=$(curl -fsSL -H "User-Agent: $USER_AGENT" \
            https://fill.papermc.io/v3/projects/paper/versions/26.2/builds)
          URL=$(printf '%s' "$BUILDS" | jq -r 'first(.[] | select(.id == 121) | .downloads."server:default".url) // empty')
          test -n "$URL"
          curl -fsSL -H "User-Agent: $USER_AGENT" -o paper.jar "$URL"

      - name: Run fixture plugin on Paper 26.2
        shell: bash
        run: |
          mkdir -p server/plugins
          cp paper.jar server/paper.jar
          cp build/libs/*.jar server/plugins/
          printf 'eula=true\n' > server/eula.txt
          cd server
          set +e
          timeout 180 java -Xms512M -Xmx1G -jar paper.jar --nogui 2>&1 | tee server.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi
          grep 'ISSUE80_262_ITEMSTACK_BASE64=' server.log
