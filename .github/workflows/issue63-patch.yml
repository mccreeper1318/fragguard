name: Apply issue 63 database patch

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/issue63-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 2

      - name: Apply explicit lookup cutoff support
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/main/java/org/pinnaclesmp/fragguard/Database.java")
          text = path.read_text()
          anchor = '''    CompletableFuture<List<RollbackTarget>> rollbackTargetsAsync(String worldName, int centerX, int centerZ,
                                                                   int radius, long targetTimestamp,
                                                                   long snapshotTimestamp, int maxBlocks) {
'''
          method = '''    CompletableFuture<LookupPage> lookupSinceAsync(String worldName, int centerX, int centerZ, int radius,
                                                   int page, int pageSize, long cutoffTimestamp) {
        String worldUuid = resolveWorldUuid(worldName);
        return submit(databaseConnection -> {
            int total = countLookup(databaseConnection, worldUuid, worldName, centerX, centerZ, radius,
                    cutoffTimestamp);
            int totalPages = Math.max(1, (int) Math.ceil(total / (double) pageSize));
            int safePage = Math.max(1, Math.min(page, totalPages));
            List<LookupRow> rows = selectLookup(databaseConnection, worldUuid, worldName, centerX, centerZ,
                    radius, cutoffTimestamp, safePage, pageSize);
            return new LookupPage(rows, safePage, pageSize, total);
        }, true);
    }

'''
          if "CompletableFuture<LookupPage> lookupSinceAsync(" in text:
              raise SystemExit("lookupSinceAsync already exists")
          if text.count(anchor) != 1:
              raise SystemExit("Could not find rollbackTargetsAsync insertion point exactly once")
          path.write_text(text.replace(anchor, method + anchor))
          PY

      - name: Verify patch
        shell: bash
        run: |
          git diff --check
          grep -n "lookupSinceAsync" src/main/java/org/pinnaclesmp/fragguard/Database.java

      - name: Commit database patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/org/pinnaclesmp/fragguard/Database.java
          git commit -m "Apply GUI lookup cutoff in SQLite (#63)"
          git push origin HEAD:dev
