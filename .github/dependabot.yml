version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # Paper's repository version ordering does not map cleanly to Dependabot's
      # upgrade ordering; older 26.2-rc-2.build.*-alpha coordinates were proposed
      # as upgrades from the newer 26.2.build.* line. Review Paper API updates manually.
      - dependency-name: "io.papermc.paper:paper-api"
    groups:
      routine-gradle-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        # Keep Paper and SQLite isolated so they can receive dedicated server validation.
        exclude-patterns:
          - "io.papermc.paper:paper-api"
          - "org.xerial:sqlite-jdbc"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
