version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      routine-gradle-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        # Keep Paper and SQLite isolated so they can receive dedicated server validation.
        exclude-patterns:
          - "io.papermc.paper:paper-api"
          - "org.xerial:sqlite-jdbc"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
